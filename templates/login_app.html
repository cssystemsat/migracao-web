<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso restrito — Migração {{ app_version }}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="tela-acesso">
    <form method="post" class="cartao-acesso">
      <div class="logo-acesso">⚡</div>
      <h1>Migração <span>{{ app_version }}</span></h1>
      {% if modo_setup %}
        <p class="acesso-subtitulo">Primeiro acesso — crie o usuário administrador</p>
      {% else %}
        <p class="acesso-subtitulo">Acesso restrito</p>
      {% endif %}
      {% if erro %}<p class="acesso-erro">{{ erro }}</p>{% endif %}
      <input type="text" name="usuario" placeholder="Usuário" autocomplete="username" autofocus required>
      <input type="password" name="senha" placeholder="Senha" autocomplete="{{ 'new-password' if modo_setup else 'current-password' }}" required>
      {% if modo_setup %}
        <input type="password" name="confirmar_senha" placeholder="Confirmar senha" autocomplete="new-password" required>
      {% endif %}
      <button type="submit" class="btn-primary">{{ 'Criar usuário e entrar' if modo_setup else 'Entrar' }}</button>
    </form>
  </div>
</body>
</html>
